name: CI/CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Check server.js
        run: node --check server.js

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/amanbharti01/devops-node-app:${{ github.sha }}

      - name: Update Kubernetes image
        run: |
          sed -i "s|image: .*|image: ghcr.io/amanbharti01/devops-node-app:${{ github.sha }}|" k8s/deployment.yaml

      - name: Commit Kubernetes change
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add k8s/deployment.yaml
          git commit -m "Deploy image ${{ github.sha }} [skip ci]" || echo "No changes to commit"
          git push
