apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-node-app
  labels:
    app: devops-node-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-node-app
  template:
    metadata:
      labels:
        app: devops-node-app
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: devops-node-app
          image: ghcr.io/amanbharti01/devops-node-app:latest
          ports:
            - containerPort: 3000
